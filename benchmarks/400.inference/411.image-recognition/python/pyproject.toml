[project]
name = "sebs-411-image-recognition"
version = "0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.22.0; python_version == '3.10'",
  "numpy==1.24.0; python_version == '3.11'",
  "numpy==1.26.4; python_version == '3.12'",
  "pillow==10.3.0",
  "torch==1.11.0; python_version == '3.10'",
  "torch==2.0.0; python_version == '3.11'",
  "torch==2.2.0; python_version == '3.12'",
  "torchvision==0.12.0; python_version == '3.10'",
  "torchvision==0.15.1; python_version == '3.11'",
  "torchvision==0.17.0; python_version == '3.12'",
]

[project.optional-dependencies] # generated by tools/lock_python_benchmarks.py
aws = []
azure = ["azure-storage-blob"]
gcp = ["google-cloud-storage==3.10.1"]
local = ["minio>=7,<8"]
openwhisk = ["minio>=7,<8"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# CPU-only torch builds. PyPI only ships CUDA-enabled Linux wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
