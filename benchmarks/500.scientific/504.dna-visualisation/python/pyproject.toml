[project]
name = "sebs-504-dna-visualisation"
version = "0"
requires-python = ">=3.10"
dependencies = [
  "contourpy==1.3.2",
  "numpy==2.2.6",
  "pillow==10.3.0",
  "squiggle==0.3.1",
]

[project.optional-dependencies] # generated by tools/lock_python_benchmarks.py
aws = []
azure = ["azure-storage-blob"]
gcp = ["google-cloud-storage==3.10.1"]
local = ["minio>=7,<8"]
openwhisk = ["minio>=7,<8"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
