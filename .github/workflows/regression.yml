name: Regression Tests

on:
  workflow_call:
    inputs:
      code_ref:
        description: Approved commit to test; empty uses the triggering commit
        type: string
        required: false
        default: ""
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

jobs:
  regression:
    strategy:
      matrix:
        include:
          - platform: aws
            language: python
            version: "3.11"
            architecture: "x64"
          - platform: aws
            language: python
            version: "3.11"
            architecture: "arm64"
          - platform: aws
            language: python
            version: "3.12"
            architecture: "x64"
          - platform: aws
            language: python
            version: "3.12"
            architecture: "arm64"
          - platform: aws
            language: nodejs
            version: "24"
            architecture: "x64"
          - platform: aws
            language: nodejs
            version: "24"
            architecture: "arm64"
          - platform: aws
            language: cpp
            version: "all"
            architecture: "x64"
          - platform: aws
            language: java
            version: "17"
            architecture: "x64"
          - platform: aws
            language: java
            version: "17"
            architecture: "arm64"
          - platform: aws
            language: java
            version: "21"
            architecture: "x64"
          - platform: aws
            language: java
            version: "21"
            architecture: "arm64"
          - platform: gcp
            language: python
            version: "3.11"
            architecture: "x64"
          - platform: gcp
            language: nodejs
            version: "20"
            architecture: "x64"
          - platform: gcp
            language: java
            version: "17"
            architecture: "x64"
          - platform: azure
            language: python
            version: "3.11"
            architecture: "x64"
          - platform: azure
            language: nodejs
            version: "20"
            architecture: "x64"
          - platform: azure
            language: java
            version: "17"
            architecture: "x64"
      fail-fast: false

    uses: $/.github/workflows/_regression-job.yml
    with:
      code_ref: ${{ inputs.code_ref }}
      platform: ${{ matrix.platform }}
      language: ${{ matrix.language }}
      version: ${{ matrix.version }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit
